<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let mark =prompt("Enter your mark");
        if(mark>=90)
    {
        console.log("Grade : A+")

    }
        else if(mark>=80)
    {
        console.log("Grade : A")
    }
    else if(mark>=75)
    {
        console.log("Grade : B+")
    }
    else if(mark>=70)
    {
        console.log("Grade : B")
    }
    else if(mark>=65)
    {
        console.log("Grade : C+")
    }
    else if(mark>=60)
    {
        console.log("Grade : C")
    }
    else if(mark>=50)
    {
        console.log("Grade : D")
    }
    else
    {
        console.log("fail")
    }

    </script>
</body>
</html>
