<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>CONTACT US</legend>
        <form action="contact_us.html" method="post" encType="multipart/form-data">
            <label for="fname">Name:</label>
            <input type="text" id="fname" name="fname" pattern="^[a-zA-Z\s]+$" placeholder="Please enter a valid name" required><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" placeholder="enter phone number" required><br><br>
            <label for="subject">Subject:</label><br><br>
            <textarea id="subject" name="subject" rows="2" cols="50" required></textarea><br><br>
            <label for="message">Message:</label><br><br>
            <textarea id="message" name="message" rows="4" cols="50" required></textarea ><br><br>
            <input type="submit" value="submit">
            <p>&copy; 2026 XYZ technologies. All rights reserved.</p>
        </form>
    </fieldset>
</body>
</html>
